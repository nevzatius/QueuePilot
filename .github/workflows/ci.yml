name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CI: 'true'
      QP_ENV: test
      GCLOUD_PROJECT: demo-queuepilot
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Integration tests (emulators, Redis Lua, web and worker smoke)
        run: pnpm test:integration
      - name: Check Node ESM artifacts (startup smoke runs inside integration)
        run: |
          node --check apps/api/dist/index.js
          node --check apps/worker/dist/index.js

  # Builds both runtime images from the repository root and smoke-runs them with demo-only settings.
  # Images are built locally on the runner only: no registry login, no push, no cloud credentials.
  docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build image (not pushed)
        run: docker build -f apps/${{ matrix.app }}/Dockerfile -t queuepilot-${{ matrix.app }}:ci .
      - name: Smoke-run image (non-root, /health, SIGTERM, unsafe production config refused)
        run: node scripts/docker-smoke.mjs --app ${{ matrix.app }} --image queuepilot-${{ matrix.app }}:ci
